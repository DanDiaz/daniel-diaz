@if (lightbox.photo(); as photo) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photograph viewer"
    (click)="$event.target === $event.currentTarget && lightbox.close()"
  >
    <button class="lb-close" type="button" aria-label="Close viewer" (click)="lightbox.close()">
      &times;
    </button>

    @if (lightbox.count() > 1) {
      <button class="lb-prev" type="button" aria-label="Previous photo" (click)="lightbox.previous()">
        &lsaquo;
      </button>
    }

    <figure>
      <img [src]="photo.full ?? photo.src" [alt]="photo.alt" />
      <figcaption>{{ photo.caption }}</figcaption>
    </figure>

    @if (lightbox.count() > 1) {
      <button class="lb-next" type="button" aria-label="Next photo" (click)="lightbox.next()">
        &rsaquo;
      </button>
    }
  </div>
}
